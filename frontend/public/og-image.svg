<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#020817"/>
      <stop offset="100%" style="stop-color:#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100"  cy="100"  r="200" fill="rgba(124,58,237,0.08)"/>
  <circle cx="1100" cy="530"  r="250" fill="rgba(37,99,235,0.08)"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="6" height="270" rx="3" fill="url(#accent)"/>

  <!-- Name -->
  <text x="116" y="270"
        font-family="Inter, Arial, sans-serif"
        font-size="72" font-weight="900"
        fill="url(#text-grad)">ARUN VINEETH J</text>

  <!-- Role -->
  <text x="118" y="340"
        font-family="Inter, Arial, sans-serif"
        font-size="34" font-weight="600"
        fill="#94a3b8">Junior DevOps Engineer</text>

  <!-- Location -->
  <text x="118" y="390"
        font-family="Inter, Arial, sans-serif"
        font-size="24" font-weight="400"
        fill="#64748b">Pudukkottai, Tamil Nadu, India</text>

  <!-- Tech tags -->
  <g font-family="'Fira Code', monospace" font-size="18" fill="#a78bfa">
    <text x="118" y="450">AWS</text>
    <text x="195" y="450" fill="#64748b">·</text>
    <text x="215" y="450">Docker</text>
    <text x="318" y="450" fill="#64748b">·</text>
    <text x="338" y="450">Kubernetes</text>
    <text x="498" y="450" fill="#64748b">·</text>
    <text x="518" y="450">Jenkins</text>
    <text x="630" y="450" fill="#64748b">·</text>
    <text x="650" y="450">Terraform</text>
    <text x="790" y="450" fill="#64748b">·</text>
    <text x="810" y="450">Ansible</text>
  </g>

  <!-- Bottom divider line -->
  <rect x="80" y="490" width="1040" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Footer note -->
  <text x="118" y="530"
        font-family="Inter, Arial, sans-serif"
        font-size="18" fill="#475569">
    B.Sc Computer Science · St. Joseph's College, Tiruchirappalli · CGPA 8.3
  </text>
</svg>
