services:
  mysql:
    image: mysql:8.0
    container_name: vineeth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vineeth_portfolio
      MYSQL_USER: vineeth_user
      MYSQL_PASSWORD: vineeth_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  memcached:
    image: memcached:1.6
    container_name: vineeth-memcached
    ports:
      - "11211:11211"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vineeth-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql_data: